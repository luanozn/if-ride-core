spring.datasource.url=jdbc:postgresql://localhost:5432/if-ride-core
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.cloud.aws.parameterstore.enabled=false
spring.cloud.aws.region.static=sa-east-1
spring.cloud.aws.region.auto=false
spring.cloud.aws.credentials.access-key=mock
spring.cloud.aws.credentials.secret-key=mock

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.locations=classpath:db/migration,classpath:db/test_data

spring.data.mongodb.uri=mongodb://localhost:27017/if-ride-chat

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha

