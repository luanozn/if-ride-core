name: IF Ride - CD (Manual Deploy)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: if-ride-core
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Resolve Instance ID
        id: instance
        run: |
          INSTANCE_ID=$(aws cloudformation list-exports \
            --query "Exports[?Name=='IfRideInstanceId'].Value" \
            --output text)
          
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "::error::Export IfRideInstanceId não encontrado no CloudFormation"
            exit 1
          fi
          
          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)
          
          if [ "$STATE" != "running" ]; then
            echo "::error::Instância $INSTANCE_ID não está running (estado atual: $STATE)"
            exit 1
          fi
          
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Instância: $INSTANCE_ID ($STATE)"

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: if-ride-core
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          COMMANDS=$(cat <<EOF
          ["set -e",
           "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
           "docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG",
           "docker stop if-ride-app || true",
           "docker rm if-ride-app || true",
           "docker run -d --name if-ride-app --restart unless-stopped -p 8080:8080 $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG",
           "docker image prune -af",
           "sleep 5",
           "docker ps --filter name=if-ride-app --format '{{.Status}}'"]
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $IMAGE_TAG" \
            --parameters "commands=$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Status: $STATUS"
          echo "--- Stdout ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
          echo "--- Stderr ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy falhou com status $STATUS"
            exit 1
          fi

      - name: Smoke Test
        run: |
          API_ENDPOINT=$(aws cloudformation list-exports \
            --query "Exports[?Name=='IfRideAppUrl'].Value" \
            --output text)
          
          if [ -z "$API_ENDPOINT" ] || [ "$API_ENDPOINT" == "None" ]; then
            echo "::error::Export IfRideAppUrl não encontrado no CloudFormation"
            exit 1
          fi
          
          TARGET_URL="${API_ENDPOINT%/}/health"
          echo "Endpoint: $TARGET_URL"
          
          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL" || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Smoke test OK (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Tentativa $i: HTTP $HTTP_CODE, aguardando..."
            sleep 6
          done
          
          echo "::error::Smoke test falhou após 10 tentativas"
          exit 1