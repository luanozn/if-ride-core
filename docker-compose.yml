services:
  postgres:
    image: 'postgres:17'
    container_name: 'if-ride-postgres'
    environment:
      POSTGRES_DB: 'if-ride-core'
      POSTGRES_USERNAME: 'postgres'
      POSTGRES_PASSWORD: 'admin'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: 'mongo:7'
    container_name: 'if-ride-mongodb'
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

volumes:
  postgres_data:
  mongodb_data: